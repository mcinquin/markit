services:
  postgres:
    image: postgres:16-alpine
    container_name: markit_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-markit}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-markit}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Pas de port exposé publiquement — accès interne uniquement
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-markit} -d ${POSTGRES_DB:-markit}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: markit_app
    restart: unless-stopped
    # Bind uniquement sur loopback : seul Apache (sur l'hôte) peut y accéder
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # DATABASE_URL est construite au démarrage (entrypoint) avec encodage URL du mot de passe.
      # Tu peux aussi définir DATABASE_URL explicitement dans .env pour surcharger.
      POSTGRES_USER: ${POSTGRES_USER:-markit}
      POSTGRES_DB: ${POSTGRES_DB:-markit}
      POSTGRES_DB_PASSWORD: ${POSTGRES_DB_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DATABASE_URL: ${DATABASE_URL:-}
      NEXTAUTH_URL: "${NEXTAUTH_URL}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      NEXTAUTH_TRUST_HOST: "1"
      NEXT_PUBLIC_APP_URL: "${NEXTAUTH_URL}"
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      ADMIN_NAME: "${ADMIN_NAME:-Admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
