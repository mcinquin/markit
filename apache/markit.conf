# ─── Redirect HTTP → HTTPS ───────────────────────────────────────────────────
<VirtualHost *:80>
    ServerName markit.example.com

    # Masquer la version Apache
    ServerTokens Prod
    ServerSignature Off

    # Redirection permanente vers HTTPS
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# ─── HTTPS ───────────────────────────────────────────────────────────────────
<VirtualHost *:443>
    ServerName markit.example.com

    # Masquer la version Apache
    ServerTokens Prod
    ServerSignature Off

    # ── SSL (Let's Encrypt via certbot) ──────────────────────────────────────
    SSLEngine On
    SSLCertificateFile      /etc/letsencrypt/live/markit.example.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/markit.example.com/privkey.pem

    # TLS 1.2 et 1.3 uniquement
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256
    SSLHonorCipherOrder     Off
    SSLSessionTickets       Off

    # ── En-têtes de sécurité (définis ici, en amont de l'app) ────────────────
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # Supprimer les en-têtes qui révèlent la stack technique
    Header always unset X-Powered-By
    Header always unset Server

    # ── Protection contre l'injection d'en-têtes X-Forwarded côté client ────
    # On écrase systématiquement ces en-têtes avec les valeurs réelles Apache
    # pour empêcher un client malveillant de falsifier son IP ou le protocole
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Real-IP         "%{REMOTE_ADDR}e"
    # Remplace (et ne prolonge pas) X-Forwarded-For pour éviter le spoofing
    RequestHeader set X-Forwarded-For   "%{REMOTE_ADDR}e"

    # ── Proxy vers l'application Next.js ─────────────────────────────────────
    ProxyPreserveHost On
    ProxyRequests     Off

    # Timeout généreux pour les connexions WebSocket longues
    ProxyTimeout 300

    # ── WebSocket Socket.io ───────────────────────────────────────────────────
    # Doit être déclaré AVANT le ProxyPass général
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/api/socketio(.*)$ ws://127.0.0.1:3000/api/socketio$1 [P,L]

    # ── Proxy HTTP général ────────────────────────────────────────────────────
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # ── Limitation de taille des requêtes entrantes ───────────────────────────
    # Protège contre les requêtes trop volumineuses (DoS simple)
    LimitRequestBody 1048576

    # ── Logs ─────────────────────────────────────────────────────────────────
    ErrorLog  ${APACHE_LOG_DIR}/markit_error.log
    CustomLog ${APACHE_LOG_DIR}/markit_access.log combined
</VirtualHost>
